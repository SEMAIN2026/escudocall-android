name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnóstico SDK preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(sin platforms)"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: gradle showSdkInfo assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EscudoCall.apk
          gh release delete latest -y --cleanup-tag >/dev/null 2>&1 || true
          git push origin :refs/tags/latest >/dev/null 2>&1 || true
          gh release create latest EscudoCall.apk --title "EscudoCall APK" --notes "APK firmado (debug) listo para instalar. Descargalo, abrilo y permite «orígenes desconocidos»."
