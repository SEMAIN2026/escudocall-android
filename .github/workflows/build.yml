name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnóstico SDK preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(sin platforms)"
          for P in android-34 android-35 android-36 android-37.2; do
            J="$ANDROID_HOME/platforms/$P/android.jar"
            if [ -f "$J" ]; then
              SIZE=$(stat -c%s "$J")
              CLASSES=$(unzip -l "$J" 2>/dev/null | grep -c "\.class" || true)
              RM=$(unzip -l "$J" 2>/dev/null | grep -iE "app/RoleManager\.class|telecom/CallResponse" | head -3 || true)
              echo "== $P: $SIZE bytes, $CLASSES classes"
              echo "$RM"
            else
              echo "== $P: SIN android.jar"
            fi
          done

      - name: Reparar android.jar (la imagen trae stub recortado sin API 29+)
        run: |
          ROBO_URL="https://repo1.maven.org/maven2/org/robolectric/android-all/15-robolectric-12650502/android-all-15-robolectric-12650502.jar"
          curl -sL --retry 3 -o /tmp/robo.jar "$ROBO_URL"
          rm -rf /tmp/robo-x && mkdir -p /tmp/robo-x
          unzip -q /tmp/robo.jar 'android/*' -d /tmp/robo-x
          echo "clases reales extraidas: $(find /tmp/robo-x -name '*.class' | wc -l)"
          PLAT="$ANDROID_HOME/platforms/android-35"
          cp "$PLAT/android.jar" /tmp/merged.jar
          (cd /tmp/robo-x && zip -q /tmp/merged.jar -r android)
          zip -d /tmp/merged.jar '*.SF' '*.RSA' '*.DSA' >/dev/null 2>&1 || true
          mv /tmp/merged.jar "$PLAT/android.jar"
          echo "android.jar reparado: $(stat -c%s "$PLAT/android.jar") bytes"
          echo "RoleManager/CallResponse presentes:"
          unzip -l "$PLAT/android.jar" | grep -E "app/RoleManager.class|telecom/CallResponse" | head -4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: gradle showSdkInfo assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EscudoCall.apk
          gh release delete latest -y --cleanup-tag >/dev/null 2>&1 || true
          git push origin :refs/tags/latest >/dev/null 2>&1 || true
          gh release create latest EscudoCall.apk --title "EscudoCall APK" --notes "APK firmado (debug) listo para instalar. Descargalo, abrilo y permite «orígenes desconocidos»."
