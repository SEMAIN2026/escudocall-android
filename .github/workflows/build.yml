name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnóstico SDK preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(sin platforms)"
          for P in android-34 android-35 android-36 android-37.2; do
            J="$ANDROID_HOME/platforms/$P/android.jar"
            if [ -f "$J" ]; then
              SIZE=$(stat -c%s "$J")
              CLASSES=$(unzip -l "$J" 2>/dev/null | grep -c "\.class" || true)
              RM=$(unzip -l "$J" 2>/dev/null | grep -iE "app/RoleManager\.class|telecom/CallResponse" | head -3 || true)
              echo "== $P: $SIZE bytes, $CLASSES classes"
              echo "$RM"
            else
              echo "== $P: SIN android.jar"
            fi
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar firma estable
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /home/runner/escudocall.jks
          ls -la /home/runner/escudocall.jks

      - name: Build
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          KEYSTORE_FILE: /home/runner/escudocall.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle showSdkInfo assembleDebug --no-daemon

      - name: Verificar firma
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | head -12

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EscudoCall.apk
          gh release delete latest -y --cleanup-tag >/dev/null 2>&1 || true
          git push origin :refs/tags/latest >/dev/null 2>&1 || true
          gh release create latest EscudoCall.apk --title "EscudoCall APK" --notes "APK firmado con clave estable: cada versión nueva se instala DIRECTO encima de la anterior, sin desinstalar. Descargalo, abrilo y permite «orígenes desconocidos»."
