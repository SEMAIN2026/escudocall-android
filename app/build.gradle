plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def tursoUrl = System.getenv("TURSO_URL") ?: ""
def tursoToken = System.getenv("TURSO_TOKEN") ?: ""

android {
    namespace 'com.escudocall.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.escudocall.app"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "TURSO_URL", "\"$tursoUrl\""
        buildConfigField "String", "TURSO_TOKEN", "\"$tursoToken\""
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release { minifyEnabled false }
    }
}
