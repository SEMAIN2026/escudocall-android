plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def tursoUrl = System.getenv("TURSO_URL") ?: ""
def tursoToken = System.getenv("TURSO_TOKEN") ?: ""

android {
    namespace 'com.escudocall.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.escudocall.app"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "TURSO_URL", "\"$tursoUrl\""
        buildConfigField "String", "TURSO_TOKEN", "\"$tursoToken\""
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release { minifyEnabled false }
    }
}

/*
 * android.jar de esta imagen de CI viene recortado (falta API 29+: RoleManager,
 * CallResponse...). Compilamos contra el framework REAL de Robolectric (Maven
 * Central); al ser compileOnly NO se empaqueta en el APK — el teléfono ya trae
 * esas clases en su framework.
 */
dependencies {
    compileOnly 'org.robolectric:android-all:15-robolectric-12650502'
}

tasks.register("showSdkInfo") {
    doLast {
        println "COMPILE_SDK=" + android.compileSdk
        println "BOOT_CP=" + android.bootClasspath.join(File.pathSeparator)
    }
}
