plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def tursoUrl = System.getenv("TURSO_URL") ?: ""
def tursoToken = System.getenv("TURSO_TOKEN") ?: ""
def keystoreFile = System.getenv("KEYSTORE_FILE") ?: ""
def keystorePass = System.getenv("KEYSTORE_PASSWORD") ?: ""
def keystoreAlias = System.getenv("KEY_ALIAS") ?: "escudocall"

android {
    namespace 'com.escudocall.app'
    compileSdk 35

    signingConfigs {
        escudo {
            if (keystoreFile != "" && file(keystoreFile).exists()) {
                storeFile file(keystoreFile)
                storePassword keystorePass
                keyAlias keystoreAlias
                keyPassword keystorePass
            }
        }
    }

    defaultConfig {
        applicationId "com.escudocall.app"
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName "3.1"
        buildConfigField "String", "TURSO_URL", "\"$tursoUrl\""
        buildConfigField "String", "TURSO_TOKEN", "\"$tursoToken\""
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        debug {
            if (keystoreFile != "" && file(keystoreFile).exists()) {
                signingConfig signingConfigs.escudo
            }
        }
        release {
            minifyEnabled false
            if (keystoreFile != "" && file(keystoreFile).exists()) {
                signingConfig signingConfigs.escudo
            }
        }
    }
}

tasks.register("showSdkInfo") {
    doLast {
        println "COMPILE_SDK=" + android.compileSdk
        println "BOOT_CP=" + android.bootClasspath.join(File.pathSeparator)
    }
}
